# /usr/bin/fork -- fork / waitpid / kill / signal, with the C library's
# vocabulary; the PrismOS-only calls stay raw through prism_raw.h.
[package]
name = "fork"
version = "0.1.0"
description = "fork / waitpid / kill / signal scenarios"

[build]
sources = ["src/fork.c"]

[install]
path = "/usr/bin/fork"

[verify]
syscalls = [1, 8, 9, 10, 38, 7, 5]
symbols = ["write", "fork", "waitpid", "signal", "kill", "__mlibc_signal_restore"]
