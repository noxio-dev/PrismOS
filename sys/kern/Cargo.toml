[package]
name = "kernel"
version = "0.2.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PrismOS kernel"
publish = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
