name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld gcc binutils make meson ninja-build python3 \
            mtools dosfstools e2fsprogs xorriso \
            qemu-system-x86 ovmf

      - name: Install Rust target
        run: rustup target add x86_64-unknown-none

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/
          key: prismos-build-${{ runner.os }}-${{ hashFiles('Makefile', '**/Makefile', '**/meson.build', '**/*.mk', 'Cargo.lock', '**/Cargo.toml', 'toolchain/**') }}
          restore-keys: |
            prismos-build-${{ runner.os }}-

      - name: Build
        run: make

      - name: Test BIOS boot
        timeout-minutes: 5
        run: make test

      - name: Test /tmp tmpfs + usr-merge (phase 3.3)
        timeout-minutes: 5
        run: python3 tests/tmpfs_drive.py build/prismos.img

      - name: Test init + tty + procfs (phase 3.3)
        timeout-minutes: 5
        run: python3 tests/init_drive.py build/prismos.img

      - name: Upload disk image (on failure, for debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-img-debug
          path: build/prismos.img
          if-no-files-found: ignore

      - name: Upload disk image (on success, latest build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-img-latest
          path: build/prismos.img
          if-no-files-found: ignore
          retention-days: 30