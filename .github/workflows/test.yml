name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld gcc binutils make meson ninja-build python3 \
            mtools dosfstools e2fsprogs xorriso \
            qemu-system-x86 ovmf

      - name: Enable KVM
        # The runners expose /dev/kvm but only to root: open it up so QEMU
        # (and the tests, which auto-detect it) can use hardware acceleration.
        # Without KVM the tests fall back to TCG, just slower.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm on this runner: tests will use TCG"

      - name: Install Rust target
        run: rustup target add x86_64-unknown-none

      - name: Build
        run: make

      - name: Test BIOS boot
        timeout-minutes: 40
        run: make test

      - name: Test tmpfs + usr-merge (userland session)
        timeout-minutes: 5
        run: python3 tests/tmpfs_drive.py build/prismos.img

      - name: Test init, tty, /proc, respawn (userland session)
        timeout-minutes: 5
        run: python3 tests/init_drive.py build/prismos.img

      - name: Upload disk image (on failure, for debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-img-debug
          path: build/prismos.img
          if-no-files-found: ignore

      - name: Upload disk image (on success, latest build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-img-latest
          path: build/prismos.img
          if-no-files-found: ignore
          retention-days: 30