# /usr/bin/minish -- the bootstrap shell (phase 3.3.7), busybox ash's
# tenant since 3.4.5: what init respawns on the terminals is /usr/bin/sh,
# the busybox symlink, and this stays as the test rig the phase's
# scenarios ran on -- the honest fallback a session can always exec
# (termios, /proc, statfs, the interruptible reads, one builtin set,
# no pipes, no redirections: exactly the rig the README's 3.3 promises
# busybox would replace).
[package]
name = "sh"
version = "0.1.0"
description = "the bootstrap shell: builtins + PATH exec, on the tty's line discipline"

[build]
sources = ["src/sh.c"]

[install]
path = "/usr/bin/minish"

# verify.sh's minish diet: every syscall the program makes (the foreground
# claim and df's statfs go raw -- prism_ioctl / prism_statfs, hence 29 /
# 48 without the libc symbols; signal() is mlibc's sigaction wrapper,
# hence 38; the exit path is _exit, syscall 0 never rides a symbol).
[verify]
syscalls = [1, 2, 7, 8, 9, 13, 14, 15, 19, 24, 25, 28, 29, 30, 31, 32, 38, 43, 47, 48, 49, 58, 59, 60, 61]
symbols = ["printf", "read", "write", "open", "close", "opendir", "readdir", "lstat", "stat", "fork", "execve", "waitpid", "chdir", "getcwd", "unlink", "mkdir", "rmdir", "readlink", "getpid", "getpgrp", "setsid", "setpgid", "signal"]

# 58 lstat (ls -l on a symlink), 59 setsid / 60 setpgid / 61 getpgid:
# the session + process-group setup of phase 3.3.4 (the foreground claim
# is a group now, hence the TIOCSCTTY / TIOCSPGRP pair riding 29).
