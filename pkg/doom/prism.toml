# 1990s C: -O2 without the strict aliasing the code never promised, and
# a quieter -Wextra (the tree is full of int/unsigned comparisons and
# callbacks that ignore their parameters -- noise, not rot).
cflags = ["-fno-strict-aliasing", "-Wno-sign-compare",
          "-Wno-unused-parameter", "-Wno-missing-field-initializers"]

[install]
path = "/usr/bin/doom"

# The program's ABI, checked under disassembly: every syscall it makes and
# a symbol or two those paths live in (verify.sh's reaches).  The diet is
# the game's: stdio (write 1 / read 13) for the WAD and the tty, lseek 16
# (the WAD's fseek), open 14 / close 15 (fopen of the IWAD -- the stdio
# vtable the disassembly cannot see through), the anonymous maps mlibc's
# allocator and the doom zone live in (22 / 23), the game's start chdir
# (24), the tty's fcntl pair (27: F_GETFL/F_SETFL, the O_NONBLOCK of
# DG_GetKey), the terminal's termios pair, the mouse's EVIOCGKEY resync
# and the KDGKBENT lookup that picks ZQSD vs WASD (29; the mouse itself
# is open 14 / read 13 / close 15 on /dev/input/event1, and the serial
# path opens /dev/console 14 / close 15 for the keymap), the signal
# registration
# of the restore path (38) and the raw trio of pkg/include/prism_raw.h
# (3 / 5 / 44 / 45).  The whole libc.a carries more wrappers than the
# game will ever call (they come along for the file-granular link), so
# the list spells the paths the program takes, the way cube's does.
[verify]
syscalls = [1, 3, 5, 13, 14, 15, 16, 22, 23, 24, 27, 29, 38, 44, 45]
symbols = ["printf", "malloc", "open", "read", "write", "close", "lseek",
           "tcsetattr", "fcntl", "DG_Init", "DG_DrawFrame", "DG_GetKey"]