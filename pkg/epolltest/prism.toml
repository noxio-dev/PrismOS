# /usr/bin/epolltest -- epoll from ring 3: level / edge / oneshot, pipes and
# sockets, a nested epoll, the error answers, a wait woken by a forked child.
[package]
name = "epolltest"
version = "0.1.0"
description = "epoll scenarios (epoll_create1 / epoll_ctl / epoll_wait)"

[build]
sources = ["src/epolltest.c"]

[install]
path = "/usr/bin/epolltest"

[verify]
# 1 write, 13 read, 15 close, 18 pipe, 8 fork, 9 waitpid, 7 exit, 91
# socketpair, then 109 epoll_create1, 110 epoll_ctl, 111 epoll_wait.
syscalls = [1, 13, 15, 18, 8, 9, 7, 91, 109, 110, 111]
symbols = ["write", "read", "pipe", "fork", "waitpid", "socketpair", "epoll_create1", "epoll_ctl", "epoll_wait"]
