# PrismOS loader defaults -- /boot/defaults/loader.conf
#
# Do not edit: put your overrides in /boot/loader.conf, which is read after
# this file.  Syntax is the same as FreeBSD's loader.conf:  name="value"

kernel="/boot/kernel/kernel"       # ELF64 kernel to load
kernel_options=""                  # command line passed to the kernel

autoboot_delay="5"                 # seconds before booting; "-1" = wait forever, "NO" = no timeout
beastie_disable="NO"               # "YES" skips the menu and boots straight away
loader_menu_title="Welcome to PrismOS"
loader_color="YES"                 # ANSI colors in the menu
vbe_mode="auto"                    # BIOS boot only: kernel display. "auto" = best 32 bpp mode up to 1080p,
                                   # "1024x768" = exact mode, "off" = VGA text 80x25

# Loadable modules: for each <name>, set <name>_load="YES" and optionally
#   <name>_name="/path/to/file"  and  <name>_type="type"
# Modules are loaded in the order they appear in the configuration files.
#
#   initrd_load="YES"
#   initrd_name="/boot/initrd.img"
#   initrd_type="initrd"
